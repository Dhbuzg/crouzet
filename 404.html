<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fff7e9">
  <title>Page introuvable — Crèmerie Crouzet</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">
  <link rel="stylesheet" href="/style.css">
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: clamp(24px, 4vw, 56px);
    }
    .error-brand {
      font: italic 500 clamp(34px, 5vw, 64px)/1.2 Gambetta, Georgia, serif;
    }
    .error-content {
      width: min(100%, 700px);
      margin: auto;
      padding: 80px 0;
    }
    .error-code {
      margin-bottom: 24px;
      font-size: 15px;
      letter-spacing: .12em;
    }
    .error-content h1 {
      font: italic 400 clamp(48px, 8vw, 96px)/1.05 Newsreader, Georgia, serif;
    }
    .error-content p:not(.error-code) {
      max-width: 540px;
      margin-top: 30px;
    }
    .error-link {
      display: inline-block;
      margin-top: 48px;
      padding: 14px 20px;
      border: 1px solid currentColor;
    }
  </style>
</head>
<body>
  <div class="error-page">
    <header><a class="error-brand" href="/" aria-label="Crouzet — retour à l’accueil">Crouzet</a></header>
    <main class="error-content">
      <p class="error-code">ERREUR 404</p>
      <h1>Cette page est introuvable.</h1>
      <p>Le lien a peut-être changé. Retrouvez les plateaux, les marchés et les coordonnées d’Olivier sur la page d’accueil.</p>
      <a class="error-link" href="/">Retour à l’accueil →</a>
    </main>
  </div>
</body>
</html>
